<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fafafa;
    }

    #tiflux-widget-root {
      visibility: hidden !important;
    }

    #secullum-audio-control {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 2147483647;
      display: none;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid #346ebc;
      border-radius: 50%;
      background: #fff;
      color: #346ebc;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
    }

    #secullum-audio-control svg {
      width: 22px;
      height: 22px;
      vertical-align: middle;
    }

    #secullum-audio-preview {
      position: fixed;
      left: 20px;
      bottom: 78px;
      z-index: 2147483647;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      color: #346ebc;
      box-shadow: 0 2px 8px #0002;
      font: 14px Arial, sans-serif;
    }

    #secullum-audio-preview audio { max-width: 220px; }
    #secullum-audio-preview button {
      border: 0;
      background: transparent;
      color: #346ebc;
      cursor: pointer;
      font-size: 18px;
    }

    #secullum-audio-error {
      position: fixed;
      left: 20px;
      bottom: 136px;
      z-index: 2147483647;
      display: none;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      color: #5d5d5d;
      box-shadow: 0 2px 8px #0003;
      font: 14px/1.4 Arial, sans-serif;
    }
  </style>
</head>

<body>
  <script>
    const widgetToken = "4dbbca22-ea44-4171-a4c7-23b3031a77d4";
    // Configure this to the base URL of the separately deployed Secullum IA API.
    window.SECULLUM_IA_API_BASE_URL = "";
    const transcriptionApiBase = (window.SECULLUM_IA_API_BASE_URL || window.location.origin).replace(/\/$/, "");
    const transcriptionEndpoint = `${transcriptionApiBase}/secullum-ia/transcribe-upload`;
    const maxAudioBytes = 20 * 1024 * 1024;

    const audioControl = document.createElement("button");
    audioControl.id = "secullum-audio-control";
    audioControl.type = "button";
    audioControl.title = "Gravar áudio";
    audioControl.setAttribute("aria-label", "Gravar áudio");
    audioControl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"></path></svg>';
    document.body.appendChild(audioControl);

    const audioPreview = document.createElement("div");
    audioPreview.id = "secullum-audio-preview";
    audioPreview.innerHTML = '<audio controls></audio><button type="button" aria-label="Apagar áudio" title="Apagar áudio">×</button>';
    document.body.appendChild(audioPreview);
    const previewAudio = audioPreview.querySelector("audio");
    const deleteAudioButton = audioPreview.querySelector("button");

    const audioError = document.createElement("div");
    audioError.id = "secullum-audio-error";
    audioError.setAttribute("role", "alert");
    document.body.appendChild(audioError);

    let mediaRecorder;
    let recordedChunks = [];
    let recordedBlob;
    let previewUrl;
    let isRecording = false;
    let sendingAudio = false;
    let recordingTooLarge = false;

    function showAudioError(message) {
      audioError.textContent = message;
      audioError.style.display = "block";
      clearTimeout(showAudioError.timeout);
      showAudioError.timeout = setTimeout(() => { audioError.style.display = "none"; }, 6000);
    }

    function clearAudioPreview() {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = undefined;
      recordedBlob = undefined;
      previewAudio.removeAttribute("src");
      previewAudio.load();
      audioPreview.style.display = "none";
    }

    function setRecordingState(recording) {
      isRecording = recording;
      audioControl.style.background = recording ? "#346ebc" : "#fff";
      audioControl.style.color = recording ? "#fff" : "#346ebc";
      audioControl.title = recording ? "Parar gravação" : "Gravar áudio";
      audioControl.setAttribute("aria-label", audioControl.title);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = () => reject(new Error("Não foi possível ler a gravação."));
        reader.readAsDataURL(blob);
      });
    }

    async function transcribeAndSend(blob) {
      if (sendingAudio) return;
      sendingAudio = true;
      audioControl.disabled = true;
      try {
        const dataBase64 = await blobToBase64(blob);
        const response = await fetch(transcriptionEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            filename: `gravacao.${blob.type.includes("ogg") ? "ogg" : "webm"}`,
            mime_type: blob.type || "audio/webm",
            data_base64: dataBase64,
          }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok || !String(result.text || "").trim()) {
          throw new Error(result.error || "Não foi possível transcrever o áudio. Tente novamente.");
        }
        const shadow = document.querySelector("#tiflux-widget-root")?.shadowRoot;
        const editor = shadow?.querySelector('[contenteditable="true"]');
        if (!editor) throw new Error("Não foi possível localizar o campo de mensagem do widget.");
        const transcript = `transcricao de audio: ${String(result.text).trim()}`;
        editor.focus();
        editor.textContent = transcript;
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: transcript }));
        const sendButton = shadow?.querySelector('button[aria-label="Enviar mensagem"]');
        if (!sendButton) throw new Error("Não foi possível localizar o botão de envio do widget.");
        latestHistoryBlob = recordedBlob;
        clearAudioPreview();
        sendButton.click();
        setTimeout(() => renderAudioHistory(latestHistoryBlob), 250);
      } catch (error) {
        showAudioError(error.message || "Erro ao enviar a transcrição. Tente novamente.");
      } finally {
        sendingAudio = false;
        audioControl.disabled = false;
      }
    }

    audioControl.addEventListener("click", async () => {
      if (sendingAudio) return;
      if (isRecording) {
        mediaRecorder?.stop();
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        showAudioError("Este navegador não permite gravar áudio.");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        recordingTooLarge = false;
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => {
          if (!event.data?.size) return;
          if (recordingTooLarge) return;
          if (recordedChunks.reduce((total, part) => total + part.size, 0) + event.data.size > maxAudioBytes) {
            recordingTooLarge = true;
            mediaRecorder.stop();
            stream.getTracks().forEach((track) => track.stop());
            recordedChunks = [];
            clearAudioPreview();
            setRecordingState(false);
            showAudioError("O áudio excede o limite de 20 MB. Grave um áudio menor.");
            return;
          }
          recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((track) => track.stop());
          setRecordingState(false);
          if (recordingTooLarge) return;
          if (!recordedChunks.length) return;
          recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          previewUrl = URL.createObjectURL(recordedBlob);
          previewAudio.src = previewUrl;
          audioPreview.style.display = "flex";
        };
        mediaRecorder.start(1000);
        setRecordingState(true);
      } catch (error) {
        showAudioError(error.name === "NotAllowedError" ? "Permita o acesso ao microfone para gravar áudio." : "Não foi possível iniciar a gravação.");
      }
    });

    deleteAudioButton.addEventListener("click", clearAudioPreview);
    previewAudio.addEventListener("play", () => {});
    let connectedShadow;
    let latestHistoryBlob;
    function renderAudioHistory(blob) {
      const shadow = document.querySelector("#tiflux-widget-root")?.shadowRoot;
      if (!shadow || !blob) return;
      const messages = [...shadow.querySelectorAll("[class*=message], [class*=Message]")];
      const transcriptText = "transcricao de audio:";
      const message = messages.reverse().find((element) => element.textContent?.toLowerCase().includes(transcriptText));
      if (!message || message.querySelector("audio[data-secullum-history]")) return;
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.dataset.secullumHistory = "true";
      audio.src = URL.createObjectURL(blob);
      Object.assign(audio.style, { display: "block", maxWidth: "240px", marginTop: "6px" });
      message.appendChild(audio);
      latestHistoryBlob = undefined;
    }

    function connectSendHandler() {
      const shadow = document.querySelector("#tiflux-widget-root")?.shadowRoot;
      if (!shadow || connectedShadow === shadow) return;
      connectedShadow = shadow;
      shadow.addEventListener("click", (event) => {
        const sendButton = event.target instanceof Element
          ? event.target.closest('button[aria-label="Enviar mensagem"]')
          : null;
        if (!sendButton || !recordedBlob || sendingAudio) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        transcribeAndSend(recordedBlob);
      }, true);
    }

    const shadowPoll = setInterval(() => {
      connectSendHandler();
      if (connectedShadow) clearInterval(shadowPoll);
    }, 100);

    async function checkTranscriptionRoute() {
      try {
        const response = await fetch(transcriptionEndpoint, { method: "GET", mode: "cors", credentials: "include" });
        // A rota é POST. Um 405 confirma que a rota existe sem enviar áudio.
        if (response.status === 405) audioControl.style.display = "block";
        else showAudioError("O serviço de transcrição não está disponível neste endereço.");
      } catch (_) {
        showAudioError("O serviço de transcrição não está disponível neste endereço.");
      }
    }
    checkTranscriptionRoute();

    window.TifluxWidgetConfig = {
      token: widgetToken,
      xOffset: 24,
      yOffset: 24,
      identify: {
        name: "Nome do usuário",
        email: "email@empresa.com",
        phone: "11999990000",
        externalId: "id-do-usuario",
      },
    };

    localStorage.setItem(`@TifluxWidget:IsOpen:${widgetToken}`, "true");

    const waitForWidget = setInterval(() => {
      const root = document.querySelector("#tiflux-widget-root");

      if (!root?.shadowRoot) return;

      clearInterval(waitForWidget);

      const getInternalButton = () =>
        root.shadowRoot.querySelector("#tiflux-widget-app > button");

      const syncWidget = () => {
        connectSendHandler();
        renderAudioHistory(latestHistoryBlob);
        const button = getInternalButton();
        const app = root.shadowRoot.querySelector("#tiflux-widget-app");
        const widgetPage = app?.querySelector(":scope > div");

        if (button) {
          if (button.style.visibility !== "hidden") {
            button.style.setProperty("visibility", "hidden", "important");
          }

          if (root.style.visibility !== "visible") {
            root.style.setProperty("visibility", "visible", "important");
          }
        }

        if (widgetPage) {
          root.style.setProperty("position", "fixed", "important");
          root.style.setProperty("inset", "0", "important");
          root.style.setProperty("width", "100vw", "important");
          root.style.setProperty("height", "100vh", "important");

          widgetPage.style.setProperty("position", "fixed", "important");
          widgetPage.style.setProperty("top", "50%", "important");
          widgetPage.style.setProperty("left", "50%", "important");
          widgetPage.style.setProperty("transform", "translate(-50%, -50%)", "important");
          widgetPage.style.setProperty("width", "min(80vw, 1400px)", "important");
          widgetPage.style.setProperty("height", "80vh", "important");
          widgetPage.style.setProperty("max-width", "1400px", "important");
          widgetPage.style.setProperty("max-height", "none", "important");
          widgetPage.style.setProperty("border-radius", "16px", "important");

          widgetPage
            .querySelectorAll('[aria-label="Recolher"], [aria-label="Fechar"]')
            .forEach((button) => {
              button.style.setProperty("display", "none", "important");
            });
        }
      };

      const observer = new MutationObserver(syncWidget);

      observer.observe(root.shadowRoot, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["style", "class"],
      });

      syncWidget();
    }, 100);

    const widgetScript = document.createElement("script");
    widgetScript.src = "https://public-assets.tiflux.com/widget/tiflux-widget.iife.js";
    document.head.appendChild(widgetScript);
  </script>
</body>
</html>
